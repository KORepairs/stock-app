<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inventory Duplicate Review</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/app.css" />
    <style>
      .banner {
        background: #fef3c7;
        border: 1px solid #f59e0b;
        color: #78350f;
        border-radius: 12px;
        padding: 12px 14px;
        font-weight: 700;
        margin: 0 0 16px;
      }
      .banner p {
        margin: 0 0 8px;
      }
      .banner p:last-child {
        margin-bottom: 0;
        font-weight: 700;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin: 0 0 16px;
      }
      .toolbar input[type="search"] {
        min-width: min(100%, 280px);
        flex: 1;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.55rem 0.65rem;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      .meta {
        color: var(--muted);
        font-size: 14px;
      }
      .summary-section {
        margin: 0 0 16px;
      }
      .summary-heading {
        font-size: 13px;
        font-weight: 800;
        margin: 0 0 8px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 10px;
        margin: 0;
      }
      .summary-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        cursor: pointer;
        text-align: left;
      }
      .summary-card.active {
        outline: 2px solid #2563eb;
      }
      .summary-card .count {
        font-size: 28px;
        font-weight: 800;
        line-height: 1.1;
      }
      .summary-card .label {
        color: var(--muted);
        font-size: 13px;
        margin-top: 4px;
      }
      .filter-groups {
        display: grid;
        gap: 12px;
        margin: 0 0 16px;
      }
      .filter-label {
        font-size: 13px;
        font-weight: 800;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 0 0 6px;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .filters button {
        border: 1px solid var(--border);
        background: var(--panel);
        border-radius: 999px;
        padding: 6px 12px;
        cursor: pointer;
      }
      .filters button.active {
        background: #111;
        color: #fff;
        border-color: #111;
      }
      .group {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        margin: 0 0 12px;
      }
      .group.variant {
        border-color: #7c3aed;
        background: #f5f3ff;
      }
      .group.high {
        border-color: #b91c1c;
      }
      .group.medium {
        border-color: #d97706;
      }
      .group-head {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: baseline;
        margin-bottom: 8px;
      }
      .pill {
        display: inline-block;
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 12px;
        font-weight: 700;
        border: 1px solid var(--border);
      }
      .pill.high { background: #fee2e2; color: #991b1b; }
      .pill.medium { background: #ffedd5; color: #9a3412; }
      .pill.review { background: #ede9fe; color: #5b21b6; }
      .reason { color: var(--muted); margin: 0 0 10px; }
      .table-wrap { overflow-x: auto; }
      table.dup {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      table.dup th,
      table.dup td {
        border-top: 1px solid var(--border);
        padding: 8px 6px;
        text-align: left;
        vertical-align: top;
      }
      table.dup th { font-size: 12px; color: var(--muted); }
      .empty, .status {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
      }
      .status.err { color: #b91c1c; }
      .notes { white-space: pre-wrap; word-break: break-word; }
      .mono {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .decision-form {
        margin-top: 14px;
        border-top: 1px solid var(--border);
        padding-top: 12px;
      }
      .decision-status {
        font-weight: 800;
        margin: 0 0 10px;
      }
      .decision-choices {
        display: grid;
        gap: 8px;
        margin: 0 0 12px;
      }
      .decision-option {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        border: 2px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        background: #fff;
        cursor: pointer;
      }
      .decision-option.selected {
        border-color: #111;
        border-style: dashed;
        background: #f3f4f6;
      }
      .decision-option .mark {
        font-weight: 800;
        min-width: 5.2rem;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .decision-option input {
        margin-top: 3px;
      }
      .decision-notes-label {
        display: block;
        font-weight: 700;
        margin: 0 0 6px;
      }
      .decision-notes {
        width: 100%;
        min-height: 80px;
        resize: vertical;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.55rem 0.65rem;
        font: inherit;
      }
      .decision-meta {
        color: var(--muted);
        font-size: 13px;
        margin: 8px 0;
      }
      .decision-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
      }
      .decision-msg {
        margin: 8px 0 0;
        min-height: 1.2em;
      }
      .decision-msg.err { color: #b91c1c; font-weight: 700; }
      .decision-msg.ok { color: #166534; font-weight: 700; }
      .decision-msg.warn { color: #9a3412; font-weight: 700; }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      .summary-card:focus-visible,
      .decision-option:focus-within {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
      }
      @media (max-width: 640px) {
        .decision-choices { grid-template-columns: 1fr; }
        .toolbar input[type="search"] { min-width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <aside id="sidebar"></aside>
      <main class="page">
        <h1>Inventory Duplicate Review</h1>
        <div class="banner">
          <p>Decisions only classify review groups.</p>
          <p>Nothing on this page merges, deletes or changes stock, products or quantities.</p>
        </div>

        <div class="toolbar">
          <button type="button" class="btn" id="reloadBtn">Reload</button>
          <span class="meta" id="generatedAt">Not loaded yet</span>
          <span class="meta" id="totals"></span>
          <label class="visually-hidden" for="search">Search SKU, Part Number, name or notes</label>
          <input id="search" type="search" placeholder="Search SKU, Part Number, name or notes" />
        </div>

        <section class="summary-section" aria-labelledby="decisionSummaryHeading">
          <h2 class="summary-heading" id="decisionSummaryHeading">Decision counts</h2>
          <div class="cards" id="decisionSummaryCards"></div>
        </section>
        <section class="summary-section" aria-labelledby="categorySummaryHeading">
          <h2 class="summary-heading" id="categorySummaryHeading">Duplicate category counts</h2>
          <div class="cards" id="summaryCards"></div>
        </section>
        <div class="filter-groups">
          <div class="filter-group">
            <div class="filter-label" id="decisionFilterLabel">Decision</div>
            <div class="filters" id="decisionFilters" role="group" aria-labelledby="decisionFilterLabel"></div>
          </div>
          <div class="filter-group">
            <div class="filter-label" id="typeFilterLabel">Confidence and category</div>
            <div class="filters" id="filters" role="group" aria-labelledby="typeFilterLabel"></div>
          </div>
        </div>
        <div id="status" class="status" role="status" aria-live="polite">Loading…</div>
        <div id="results"></div>
      </main>
    </div>

    <script>
      const CATEGORIES = [
        { id: 'exact_sku', label: 'Exact SKU' },
        { id: 'exact_part_number', label: 'Same Part Number and notes' },
        { id: 'possible_variant', label: 'Possible variants' },
        { id: 'cross_collision', label: 'SKU / Part Number collision' },
        { id: 'likely_part_number', label: 'Likely Part Number' },
        { id: 'exact_name', label: 'Same name' },
        { id: 'suspicious', label: 'Missing / suspicious' },
      ];

      const DECISIONS = [
        { id: 'needs_physical_check', label: 'Needs physical check' },
        { id: 'confirmed_duplicate', label: 'Confirmed duplicate' },
        { id: 'valid_variant', label: 'Valid variant' },
        { id: 'keep_separate', label: 'Keep separate' },
      ];

      const DECISION_FILTERS = [
        { id: 'all', label: 'All' },
        { id: 'unreviewed', label: 'Unreviewed' },
        ...DECISIONS,
      ];

      const TYPE_FILTERS = [
        { id: 'all', label: 'All' },
        { id: 'high', label: 'High confidence' },
        { id: 'medium', label: 'Medium confidence' },
        { id: 'review', label: 'Review only' },
        ...CATEGORIES.map((c) => ({ id: c.id, label: c.label })),
      ];

      const $ = (id) => document.getElementById(id);
      let payload = null;
      let typeFilter = 'all';
      let decisionFilter = 'all';
      let loadGeneration = 0;
      let loadController = null;
      let saveEpoch = 0;
      const drafts = new Map();
      const saveControllers = new Map();
      const saveTokens = new Map();
      const savingKeys = new Set();
      const saveMessages = new Map();

      function isAbortError(err) {
        return Boolean(err) && (err.name === 'AbortError' || err.code === 20);
      }

      function groupKey(group) {
        return String(group.category || '') + '\0' + String(group.memberKey || '');
      }

      function domKey(group) {
        return (
          String(group.category || '') +
          '__' +
          String(group.memberKey || '').replace(/[^A-Za-z0-9]+/g, '-')
        );
      }

      function abortInFlightSaves() {
        saveEpoch += 1;
        for (const controller of saveControllers.values()) {
          controller.abort();
        }
        saveControllers.clear();
        savingKeys.clear();
      }

      function resetStaleView(statusText, isError) {
        payload = null;
        drafts.clear();
        saveMessages.clear();
        $('generatedAt').textContent = isError ? 'Not loaded' : 'Loading…';
        $('totals').textContent = '';
        $('decisionSummaryCards').replaceChildren();
        $('summaryCards').replaceChildren();
        $('results').replaceChildren();
        const status = $('status');
        status.hidden = false;
        status.className = isError ? 'status err' : 'status';
        status.textContent = statusText;
      }

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }

      function display(value) {
        if (value == null || value === '') return '—';
        return String(value);
      }

      function formatDate(value) {
        if (value == null || value === '') return '—';
        const d = new Date(value);
        if (Number.isNaN(d.getTime())) return String(value);
        return d.toLocaleString();
      }

      function decisionLabel(id) {
        const found = DECISIONS.find((item) => item.id === id);
        return found ? found.label : 'Unreviewed';
      }

      function currentDecisionId(group) {
        const saved = group?.decision?.decision;
        return saved || 'unreviewed';
      }

      function matchesSearch(group, q) {
        if (!q) return true;
        return group.products.some((p) => {
          const hay = [p.sku, p.code, p.name, p.notes]
            .map((v) => String(v || '').toLowerCase())
            .join(' ');
          return hay.includes(q);
        });
      }

      function matchesTypeFilter(group) {
        if (typeFilter === 'all') return true;
        if (typeFilter === 'high' || typeFilter === 'medium' || typeFilter === 'review') {
          return group.confidence === typeFilter;
        }
        return group.category === typeFilter;
      }

      function matchesDecisionFilter(group) {
        if (decisionFilter === 'all') return true;
        return currentDecisionId(group) === decisionFilter;
      }

      function renderFilterButtons(host, filters, active, onSelect) {
        host.replaceChildren();
        for (const filter of filters) {
          const btn = el('button', active === filter.id ? 'active' : '', filter.label);
          btn.type = 'button';
          btn.setAttribute('aria-pressed', active === filter.id ? 'true' : 'false');
          btn.addEventListener('click', () => {
            onSelect(filter.id);
            render();
          });
          host.appendChild(btn);
        }
      }

      function renderFilters() {
        renderFilterButtons($('decisionFilters'), DECISION_FILTERS, decisionFilter, (id) => {
          decisionFilter = id;
        });
        renderFilterButtons($('filters'), TYPE_FILTERS, typeFilter, (id) => {
          typeFilter = id;
        });
      }

      function renderDecisionSummary() {
        const host = $('decisionSummaryCards');
        host.replaceChildren();
        const counts = payload?.summary?.byDecision || {};
        for (const item of DECISION_FILTERS.filter((f) => f.id !== 'all')) {
          const card = el(
            'button',
            'summary-card' + (decisionFilter === item.id ? ' active' : '')
          );
          card.type = 'button';
          card.appendChild(el('div', 'count', String(counts[item.id] ?? 0)));
          card.appendChild(el('div', 'label', item.label));
          card.addEventListener('click', () => {
            decisionFilter = item.id;
            render();
          });
          host.appendChild(card);
        }
      }

      function renderSummary() {
        const host = $('summaryCards');
        host.replaceChildren();
        const summary = payload?.summary;
        const counts = summary?.byCategory || {};
        for (const cat of CATEGORIES) {
          const card = el('button', 'summary-card' + (typeFilter === cat.id ? ' active' : ''));
          card.type = 'button';
          card.appendChild(el('div', 'count', String(counts[cat.id] ?? 0)));
          card.appendChild(el('div', 'label', cat.label));
          card.addEventListener('click', () => {
            typeFilter = cat.id;
            render();
          });
          host.appendChild(card);
        }
      }

      function recountDecisions() {
        if (!payload || !payload.summary) return;
        const counts = {
          unreviewed: 0,
          needs_physical_check: 0,
          confirmed_duplicate: 0,
          valid_variant: 0,
          keep_separate: 0,
        };
        for (const group of payload.groups || []) {
          const decision = group.decision?.decision;
          if (decision && Object.prototype.hasOwnProperty.call(counts, decision)) {
            counts[decision] += 1;
          } else {
            counts.unreviewed += 1;
          }
        }
        payload.summary.byDecision = counts;
      }

      function productIdsForSave(group) {
        if (Array.isArray(group.productIds) && group.productIds.length) {
          return group.productIds;
        }
        return (group.products || []).map((p) => Number(p.id)).filter((id) => Number.isSafeInteger(id) && id >= 1);
      }

      function renderGroup(group) {
        const key = groupKey(group);
        const wrap = el(
          'article',
          'group' +
            (group.category === 'possible_variant' ? ' variant' : '') +
            (group.confidence === 'high' ? ' high' : '') +
            (group.confidence === 'medium' ? ' medium' : '')
        );
        const head = el('div', 'group-head');
        head.appendChild(el('strong', '', group.label || group.category));
        head.appendChild(el('span', 'pill ' + (group.confidence || 'review'), group.confidence || 'review'));
        head.appendChild(el('span', 'mono', group.matchKey || ''));
        wrap.appendChild(head);
        wrap.appendChild(el('p', 'reason', group.reason || ''));

        const tableWrap = el('div', 'table-wrap');
        const table = el('table', 'dup');
        const thead = document.createElement('thead');
        const hr = document.createElement('tr');
        ['ID', 'SKU', 'Part Number', 'Name', 'Notes', 'Qty', 'Created', 'Retail', 'Cost', 'eBay'].forEach((h) => {
          hr.appendChild(el('th', '', h));
        });
        thead.appendChild(hr);
        table.appendChild(thead);
        const tbody = document.createElement('tbody');
        for (const p of group.products || []) {
          const tr = document.createElement('tr');
          const cells = [
            display(p.id),
            display(p.sku),
            display(p.code),
            display(p.name),
            display(p.notes),
            p.quantity == null ? '—' : String(p.quantity),
            formatDate(p.created_at),
            display(p.retail),
            display(p.cost),
            display(p.ebay_status),
          ];
          cells.forEach((text, i) => {
            const td = el('td', i === 1 || i === 2 ? 'mono' : i === 4 ? 'notes' : '', text);
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        }
        table.appendChild(tbody);
        tableWrap.appendChild(table);
        wrap.appendChild(tableWrap);

        const form = el('form', 'decision-form');

        const savedDecision = group.decision?.decision || '';
        const draft = drafts.get(key);
        const selectedDecision = draft && Object.prototype.hasOwnProperty.call(draft, 'decision')
          ? draft.decision
          : savedDecision;
        const notesValue = draft && Object.prototype.hasOwnProperty.call(draft, 'notes')
          ? draft.notes
          : (group.decision?.notes == null ? '' : String(group.decision.notes));
        const saving = savingKeys.has(key);
        const message = saveMessages.get(key);
        const safeId = domKey(group);

        const status = el(
          'p',
          'decision-status',
          'Current decision: ' + (savedDecision ? decisionLabel(savedDecision) : 'Unreviewed')
        );
        form.appendChild(status);

        const fieldset = document.createElement('fieldset');
        fieldset.disabled = saving;
        fieldset.appendChild(el('legend', '', 'Review decision'));

        const notesId = 'notes-' + safeId;
        const notesArea = document.createElement('textarea');
        notesArea.id = notesId;
        notesArea.className = 'decision-notes';
        notesArea.rows = 3;
        notesArea.maxLength = 2000;
        notesArea.value = notesValue;
        notesArea.addEventListener('input', () => {
          const current = drafts.get(key) || {};
          const chosen = fieldset.querySelector('input[type="radio"]:checked');
          drafts.set(key, {
            ...current,
            decision: chosen ? chosen.value : (current.decision || ''),
            notes: notesArea.value,
          });
        });

        const choices = el('div', 'decision-choices');
        const radioName = 'decision-' + safeId;

        function refreshChoiceMarks() {
          const chosen = fieldset.querySelector('input[type="radio"]:checked');
          const selectedId = chosen ? chosen.value : '';
          for (const option of choices.querySelectorAll('.decision-option')) {
            const input = option.querySelector('input[type="radio"]');
            const selected = Boolean(input && input.value === selectedId);
            option.className = 'decision-option' + (selected ? ' selected' : '');
            const mark = option.querySelector('.mark');
            if (mark) mark.textContent = selected ? 'Selected' : 'Choose';
          }
        }

        for (const item of DECISIONS) {
          const optionId = 'opt-' + safeId + '-' + item.id;
          const option = el('label', 'decision-option' + (selectedDecision === item.id ? ' selected' : ''));
          option.setAttribute('for', optionId);
          const radio = document.createElement('input');
          radio.type = 'radio';
          radio.name = radioName;
          radio.id = optionId;
          radio.value = item.id;
          radio.checked = selectedDecision === item.id;
          radio.addEventListener('change', () => {
            const current = drafts.get(key) || {};
            drafts.set(key, { ...current, decision: item.id, notes: notesArea.value });
            refreshChoiceMarks();
          });
          option.appendChild(radio);
          option.appendChild(el('span', 'mark', selectedDecision === item.id ? 'Selected' : 'Choose'));
          option.appendChild(el('span', '', item.label));
          choices.appendChild(option);
        }
        fieldset.appendChild(choices);

        const notesLabel = el('label', 'decision-notes-label', 'Notes');
        notesLabel.setAttribute('for', notesId);
        fieldset.appendChild(notesLabel);
        fieldset.appendChild(notesArea);

        const meta = el('p', 'decision-meta');
        if (group.decision && (group.decision.reviewedAt || group.decision.reviewedBy)) {
          meta.textContent =
            'Last reviewed ' +
            formatDate(group.decision.reviewedAt) +
            ' by ' +
            display(group.decision.reviewedBy) +
            '. Updated ' +
            formatDate(group.decision.updatedAt) +
            '.';
        } else {
          meta.textContent = 'Not reviewed yet.';
        }
        fieldset.appendChild(meta);

        const actions = el('div', 'decision-actions');
        const saveBtn = el('button', 'btn', saving ? 'Saving…' : 'Save decision');
        saveBtn.type = 'submit';
        saveBtn.disabled = saving;
        actions.appendChild(saveBtn);

        if (message && message.reload) {
          const reloadBtn = el('button', 'btn', 'Reload');
          reloadBtn.type = 'button';
          reloadBtn.addEventListener('click', load);
          actions.appendChild(reloadBtn);
        }
        fieldset.appendChild(actions);

        const msg = el('p', 'decision-msg' + (message ? ' ' + message.kind : ''));
        msg.setAttribute('role', 'status');
        msg.setAttribute('aria-live', 'polite');
        msg.textContent = message ? message.text : (saving ? 'Saving…' : '');
        fieldset.appendChild(msg);

        form.appendChild(fieldset);
        form.addEventListener('submit', (event) => {
          event.preventDefault();
          const chosen = fieldset.querySelector('input[type="radio"]:checked');
          if (!chosen) {
            saveMessages.set(key, { kind: 'err', text: 'Select a decision before saving.' });
            render();
            return;
          }
          saveDecision(group, chosen.value, notesArea.value);
        });
        wrap.appendChild(form);
        return wrap;
      }

      async function saveDecision(group, decision, notes) {
        const key = groupKey(group);
        if (savingKeys.has(key)) return;

        const capturedLoad = loadGeneration;
        const capturedEpoch = saveEpoch;
        const token = (saveTokens.get(key) || 0) + 1;
        saveTokens.set(key, token);

        if (saveControllers.has(key)) {
          saveControllers.get(key).abort();
        }
        const controller = new AbortController();
        saveControllers.set(key, controller);
        savingKeys.add(key);
        saveMessages.set(key, { kind: '', text: 'Saving…' });
        render();

        let data = null;
        try {
          const r = await fetch('/api/products/duplicate-review/decision', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            signal: controller.signal,
            body: JSON.stringify({
              category: group.category,
              productIds: productIdsForSave(group),
              decision,
              notes,
            }),
          });
          if (capturedLoad !== loadGeneration || capturedEpoch !== saveEpoch) return;
          if (saveTokens.get(key) !== token) return;
          const text = await r.text();
          if (capturedLoad !== loadGeneration || capturedEpoch !== saveEpoch) return;
          if (saveTokens.get(key) !== token) return;
          try {
            data = JSON.parse(text);
          } catch {
            data = {};
          }
          if (r.status === 409) {
            saveMessages.set(key, {
              kind: 'warn',
              reload: true,
              text:
                (data && typeof data.error === 'string' && data.error) ||
                'This review group has changed. Reload and review it again.',
            });
            return;
          }
          if (!r.ok) {
            saveMessages.set(key, {
              kind: 'err',
              text:
                (data && typeof data.error === 'string' && data.error) ||
                'Failed to save duplicate review decision',
            });
            return;
          }
          if (!payload) return;
          const target = (payload.groups || []).find(
            (item) => item.category === group.category && item.memberKey === group.memberKey
          );
          if (target) {
            target.decision = data.decision || null;
          }
          drafts.delete(key);
          recountDecisions();
          saveMessages.set(key, { kind: 'ok', text: 'Decision saved.' });
        } catch (err) {
          if (capturedLoad !== loadGeneration || capturedEpoch !== saveEpoch) return;
          if (saveTokens.get(key) !== token) return;
          if (isAbortError(err)) return;
          saveMessages.set(key, {
            kind: 'err',
            text: 'Failed to save duplicate review decision',
          });
        } finally {
          if (capturedLoad === loadGeneration && capturedEpoch === saveEpoch && saveTokens.get(key) === token) {
            savingKeys.delete(key);
            if (saveControllers.get(key) === controller) {
              saveControllers.delete(key);
            }
            render();
          }
        }
      }

      function render() {
        renderFilters();
        const status = $('status');
        const results = $('results');
        results.replaceChildren();

        if (!payload) return;

        renderDecisionSummary();
        renderSummary();
        $('generatedAt').textContent = payload.generatedAt
          ? 'Generated ' + formatDate(payload.generatedAt)
          : '';
        const productCount = payload.summary?.productCount ?? 0;
        const groupCount = payload.summary?.groupCount ?? 0;
        $('totals').textContent = productCount + ' products · ' + groupCount + ' groups';

        const q = ($('search').value || '').trim().toLowerCase();
        const groups = (payload.groups || []).filter(
          (g) => matchesTypeFilter(g) && matchesDecisionFilter(g) && matchesSearch(g, q)
        );

        if (!groups.length) {
          status.className = 'empty';
          status.textContent = 'No groups match the current filters.';
          status.hidden = false;
          return;
        }

        status.hidden = true;
        for (const group of groups) {
          results.appendChild(renderGroup(group));
        }
      }

      async function load() {
        const generation = ++loadGeneration;
        if (loadController) loadController.abort();
        const controller = new AbortController();
        loadController = controller;
        abortInFlightSaves();

        resetStaleView('Loading…', false);
        renderFilters();

        let data = null;
        try {
          const r = await fetch('/api/products/duplicate-review', {
            method: 'GET',
            signal: controller.signal,
          });
          if (generation !== loadGeneration) return;
          const text = await r.text();
          if (generation !== loadGeneration) return;
          try {
            data = JSON.parse(text);
          } catch {
            data = {};
          }
          if (!r.ok) {
            throw new Error(
              (data && typeof data.error === 'string' && data.error) ||
                'Failed to load duplicate review'
            );
          }
          if (generation !== loadGeneration) return;
          payload = data;
          render();
        } catch (err) {
          if (generation !== loadGeneration) return;
          if (isAbortError(err)) return;
          const message =
            (data && typeof data.error === 'string' && data.error) ||
            'Failed to load duplicate review';
          resetStaleView(message, true);
          renderFilters();
        }
      }

      $('reloadBtn').addEventListener('click', load);
      $('search').addEventListener('input', () => {
        if (payload) render();
      });
      load();
    </script>
    <script src="/js/sidebar.js"></script>
  </body>
</html>
